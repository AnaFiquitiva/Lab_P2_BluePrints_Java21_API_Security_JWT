server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://auth.example.com/.well-known/jwks.json
  main:
    allow-bean-definition-overriding: true

blueprints:
  security:
    issuer: "https://decsis-eci/blueprints"
    token-ttl-seconds: 60   # Cambiado de 3600 a 60 s para observar el efecto de expiración rápida

# ========== CONFIGURACIÓN DE SEGURIDAD ==========
app:
  cors:
    # En desarrollo: localhost:5173
    # En producción: cambiar a dominio real (p. ej., https://app.example.com)
    allowed-origins: "http://localhost:5173,http://localhost:3000"
